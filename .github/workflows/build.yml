name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Decide version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # VERSION 파일의 버전으로 빌드합니다. main에 올라온 버전에 아직 릴리스가 없으면 릴리스를 만듭니다.
          $v = (Get-Content VERSION -Raw).Trim()
          $release = 'false'
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) { $release = 'true' }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v / new release: $release"
          $global:LASTEXITCODE = 0

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/WiPass/WiPass.csproj -c Release "-p:Version=${{ steps.ver.outputs.version }}" 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # Surface the errors as annotations so they are visible on the run page
            Get-Content build.log | Where-Object { $_ -match 'error|MSB\d+' } | Select-Object -Last 15 | ForEach-Object {
              Write-Host "::error::$($_ -replace '[\r\n]', ' ')"
            }
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = "src/WiPass/bin/Release/net48"
          New-Item -ItemType Directory -Force dist/WiPass | Out-Null
          Copy-Item "$out/WiPass.exe" dist/WiPass/
          if (Test-Path "$out/WiPass.exe.config") { Copy-Item "$out/WiPass.exe.config" dist/WiPass/ }
          Copy-Item README.md, LICENSE dist/WiPass/
          Compress-Archive -Path dist/WiPass/* -DestinationPath "dist/WiPass-$v-portable.zip" -Force
          Get-ChildItem dist

      - name: Installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $numeric = ($v -split '-')[0]
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $found) {
              choco install innosetup --no-progress -y | Out-Null
              $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
            $isccPath = $found
          } else { $isccPath = $iscc.Source }
          if (-not $isccPath) { Write-Host "::error::Inno Setup not found"; exit 1 }
          Write-Host "ISCC: $isccPath"

          # Korean messages: use the bundled file if this Inno Setup version has it, otherwise fetch it.
          $innoDir = Split-Path $isccPath
          if (-not (Test-Path "$innoDir\Languages\Korean.isl")) {
            $urls = @(
              "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Korean.isl",
              "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Korean.isl")
            foreach ($u in $urls) {
              try { Invoke-WebRequest $u -OutFile installer/Korean.isl -ErrorAction Stop; Write-Host "Korean.isl from $u"; break } catch { }
            }
            if (-not (Test-Path installer/Korean.isl)) { Write-Host "::error::Korean.isl not available"; exit 1 }
          }

          & $isccPath "/DMyAppVersion=$v" "/DMyAppVersionNumeric=$numeric" installer/wipass.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Installer build failed"; exit 1 }
          Get-ChildItem dist

      - name: Store package (MSIX)
        shell: pwsh
        run: |
          # Builds two MSIX packages from the same WiPass.exe:
          #   WiPass-Test-<v>.msix  test identity, signed with a throw-away certificate (this run only) for sideloading
          #   WiPass-Store-<v>.msix Partner Center identity (store/identity.json), unsigned: the Store signs it
          $v = "${{ steps.ver.outputs.version }}"
          $parts = (($v -split '-')[0]).Split('.')
          # The Store needs a first part above 0 and a last part of 0: 0.7.x -> 1.7.<run>.0, 1.0.x -> 1.100.<run>.0 (always increasing)
          $pkgVersion = "1.$([int]$parts[0] * 100 + [int]$parts[1]).$($env:GITHUB_RUN_NUMBER).0"
          Write-Host "MSIX version: $pkgVersion"

          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $bin = Get-ChildItem $kits -Directory | Where-Object { $_.Name -match '^10\.' } | Sort-Object { [version]$_.Name } -Descending |
                 ForEach-Object { Join-Path $_.FullName 'x64' } | Where-Object { Test-Path (Join-Path $_ 'makeappx.exe') } | Select-Object -First 1
          if (-not $bin) { Write-Host "::error::Windows SDK (makeappx) not found"; exit 1 }
          Write-Host "SDK tools: $bin"
          $makeappx = Join-Path $bin 'makeappx.exe'; $makepri = Join-Path $bin 'makepri.exe'; $signtool = Join-Path $bin 'signtool.exe'

          function Build-Msix($identity, $out) {
            $layout = "dist/msix-layout"
            if (Test-Path $layout) { Remove-Item $layout -Recurse -Force }
            New-Item -ItemType Directory -Force "$layout/Assets" | Out-Null
            Copy-Item src/WiPass/bin/Release/net48/WiPass.exe $layout/
            if (Test-Path src/WiPass/bin/Release/net48/WiPass.exe.config) { Copy-Item src/WiPass/bin/Release/net48/WiPass.exe.config $layout/ }
            Copy-Item store/Assets/*.png "$layout/Assets/"
            $m = Get-Content store/AppxManifest.xml -Raw -Encoding UTF8
            $m = $m.Replace('{{IdentityName}}', $identity.IdentityName).Replace('{{Publisher}}', [System.Security.SecurityElement]::Escape($identity.Publisher))
            $m = $m.Replace('{{PublisherDisplayName}}', [System.Security.SecurityElement]::Escape($identity.PublisherDisplayName)).Replace('{{DisplayName}}', $identity.DisplayName).Replace('{{Version}}', $pkgVersion)
            [System.IO.File]::WriteAllText((Resolve-Path $layout).Path + "\AppxManifest.xml", $m, (New-Object System.Text.UTF8Encoding($false)))

            & $makepri createconfig /cf dist/priconfig.xml /dq ko-KR /pv 10.0.0 /o | Out-Null
            & $makepri new /pr $layout /cf dist/priconfig.xml /mn "$layout/AppxManifest.xml" /of "$layout/resources.pri" /o
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::makepri failed"; exit 1 }
            & $makeappx pack /d $layout /p $out /o
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::makeappx failed for $out"; exit 1 }
          }

          # --- test package (sideload) ---
          $test = @{ IdentityName = 'jomwalimu.WiPass.Test'; Publisher = 'CN=WiPass Test'; PublisherDisplayName = 'jomwalimu'; DisplayName = '와이패스 (시험판)' }
          Build-Msix $test "dist/WiPass-Test-$v.msix"
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=WiPass Test' -KeyUsage DigitalSignature -KeyAlgorithm RSA -KeyLength 2048 `
                    -FriendlyName 'WiPass test signing' -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddDays(60) `
                    -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint /s My "dist/WiPass-Test-$v.msix"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::signing the test package failed"; exit 1 }
          Export-Certificate -Cert $cert -FilePath "dist/WiPass-Test-$v.cer" | Out-Null

          # --- Store package (needs the Partner Center identity) ---
          $id = Get-Content store/identity.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($id.IdentityName -and $id.Publisher) {
            Build-Msix @{ IdentityName = $id.IdentityName; Publisher = $id.Publisher; PublisherDisplayName = $id.PublisherDisplayName; DisplayName = $id.DisplayName } "dist/WiPass-Store-$v.msix"
          } else {
            Write-Host "store/identity.json is not filled in yet: skipping the Store package"
          }
          Remove-Item dist/msix-layout -Recurse -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: WiPass-${{ steps.ver.outputs.version }}
          path: |
            dist/WiPass-Setup-*.exe
            dist/WiPass-*-portable.zip
            dist/WiPass-*.msix
            dist/WiPass-Test-*.cer

      - name: Publish release (new VERSION on main)
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $pre = if ($v -match '-') { '--prerelease' } else { '' }
          $notes = if (Test-Path "docs/release-notes/$v.md") { "docs/release-notes/$v.md" } else { $null }
          $files = @("dist/WiPass-Setup-$v.exe", "dist/WiPass-$v-portable.zip") + (Get-ChildItem dist -Filter "WiPass-Test-$v.*" | ForEach-Object { $_.FullName }) + (Get-ChildItem dist -Filter "WiPass-Store-$v.msix" | ForEach-Object { $_.FullName })
          $ghArgs = @("release", "create", "v$v") + $files + @("--title", "WiPass $v", "--target", "$env:GITHUB_SHA")
          if ($pre) { $ghArgs += $pre }
          if ($notes) { $ghArgs += @("--notes-file", $notes) } else { $ghArgs += @("--notes", "WiPass $v") }
          gh @ghArgs
