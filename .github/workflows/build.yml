name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Decide version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $v = "0.1.0-dev.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build
        run: dotnet build src/WiPass/WiPass.csproj -c Release -p:Version=${{ steps.ver.outputs.version }} -warnaserror-

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = "src/WiPass/bin/Release/net48"
          New-Item -ItemType Directory -Force dist/WiPass | Out-Null
          Copy-Item "$out/WiPass.exe" dist/WiPass/
          if (Test-Path "$out/WiPass.exe.config") { Copy-Item "$out/WiPass.exe.config" dist/WiPass/ }
          Copy-Item README.md, LICENSE dist/WiPass/
          Compress-Archive -Path dist/WiPass/* -DestinationPath "dist/WiPass-$v.zip" -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: WiPass-${{ steps.ver.outputs.version }}
          path: dist/WiPass/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $pre = if ($v -match '-') { '--prerelease' } else { '' }
          $notes = if (Test-Path "docs/release-notes/$v.md") { "docs/release-notes/$v.md" } else { $null }
          $ghArgs = @("release", "create", "v$v", "dist/WiPass-$v.zip", "--title", "WiPass $v")
          if ($pre) { $ghArgs += $pre }
          if ($notes) { $ghArgs += @("--notes-file", $notes) } else { $ghArgs += @("--notes", "WiPass $v") }
          gh @ghArgs
